<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#14002b">
  <title>Wheel of Names</title>
  <meta name="description" content="Spin a wheel to pick a random name from your list.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://wheel.malbq.dev/">
  <meta property="og:title" content="Wheel of Names">
  <meta property="og:description" content="Spin a wheel to pick a random name from your list.">
  <meta property="og:site_name" content="Wheel of Names">
  <meta property="og:image" content="https://wheel.malbq.dev/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Wheel of Names in three themes: Classic, Matrix and Synthwave">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Wheel of Names">
  <meta name="twitter:description" content="Spin a wheel to pick a random name from your list.">
  <meta name="twitter:image" content="https://wheel.malbq.dev/og-image.jpg">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎡</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Dancing+Script:wght@700&family=Marcellus&family=MedievalSharp&family=Monoton&family=Noto+Sans+Egyptian+Hieroglyphs&family=Noto+Sans+Runic&family=Orbitron:wght@500;700;900&family=Rye&family=Special+Elite&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/",
        "fireworks-js": "https://cdn.jsdelivr.net/npm/fireworks-js@2.10.8/+esm"
      }
    }
  </script>
  <script>
    // Apply saved theme and collapse states before first paint, so nothing flashes or animates on load
    {
      const root = document.documentElement;
      root.dataset.theme = localStorage.getItem('wheelTheme') || 'classic';
      if (localStorage.getItem('wheelNamesCollapsed') === '1') root.classList.add('names-collapsed');
      if (localStorage.getItem('wheelThemesCollapsed') === '1') root.classList.add('themes-collapsed');
    }
  </script>
  <script type="module" src="main.js"></script>
</head>

<body>
  <canvas id="backdrop" aria-hidden="true"></canvas>
  <canvas id="scene" aria-label="Spinning wheel of names"></canvas>
  <div id="fireworks" aria-hidden="true"></div>

  <aside class="panel names-panel">
    <header class="panel-header">
      <label for="namesList">Names</label>
      <span id="namesCount" class="badge">0</span>
      <button type="button" class="collapse-toggle" id="namesToggle" aria-expanded="true" aria-controls="namesContent" title="Collapse names">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </header>
    <div class="names-collapse">
      <div class="names-content" id="namesContent">
        <div class="names-editor">
          <div class="names-gutter" aria-hidden="true">
            <div id="namesGutter" class="names-lines"></div>
          </div>
          <div class="names-body">
            <div class="names-backdrop" aria-hidden="true">
              <div id="namesBackdrop" class="names-lines names-text"></div>
            </div>
            <textarea id="namesList" class="names-text" spellcheck="false" wrap="off" aria-describedby="namesHint"
              placeholder="One name per line&#10;Mary&#10;John&#10;// Samuel (removed)&#10;Emma"></textarea>
          </div>
        </div>
        <p class="hint" id="namesHint">
          <span class="shortcut-hint"><kbd id="toggleKey">Ctrl</kbd> <kbd>/</kbd> or</span>
          <code>//</code> removes a name
        </p>
        <div class="row">
          <button type="button" class="btn btn-ghost" id="shuffleButton">Shuffle</button>
          <button type="button" class="btn btn-ghost" id="sortButton">Sort</button>
        </div>
      </div>
    </div>
  </aside>

  <div class="dock">
    <button type="button" class="btn btn-spin" id="spinButton">
      SPIN <kbd>Space</kbd>
    </button>
    <button type="button" class="btn btn-icon" id="muteButton" aria-pressed="false" aria-label="Sound" title="Toggle sound">
      <span id="muteIcon" aria-hidden="true">🔊</span> <kbd>S</kbd>
    </button>
  </div>

  <div id="winner" class="winner" role="status" aria-live="polite">
    <div class="winner-card" hidden>
      <p class="winner-label" id="winnerLabel">The winner is</p>
      <div class="winner-name" id="winnerName"></div>
      <div class="row">
        <button type="button" class="btn btn-ghost" id="removeWinnerButton">Remove</button>
        <button type="button" class="btn btn-ghost" id="closeWinnerButton">Close</button>
      </div>
    </div>
  </div>

  <nav class="panel theme-bar" aria-label="Themes">
    <button type="button" class="theme-toggle" id="themesToggle" aria-expanded="true" aria-controls="themeList" title="Toggle themes">
      <span aria-hidden="true">🎨</span> Themes
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
        <path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
    <div class="theme-collapse">
      <div class="theme-list" id="themeList"></div>
    </div>
  </nav>
</body>

</html>
